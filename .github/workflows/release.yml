name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}
  queue: max

jobs:
  release:
    name: Publish tagged release
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Preflight tag and publication state
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/release-metadata.sh "$GITHUB_REF_NAME"
          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "NPM_DIST_TAG=$NPM_DIST_TAG"
            echo "GITHUB_PRERELEASE=$GITHUB_PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$(npm --version)"

          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "release tag must point at a commit on main" >&2; exit 1; }

          npm view @chiimagnus/applebookscli dist-tags --json > "$RUNNER_TEMP/npm-tags.json"
          LATEST=$(node -e 'const value=require(process.argv[1]); process.stdout.write(value.latest ?? "")' "$RUNNER_TEMP/npm-tags.json")
          BETA=$(node -e 'const value=require(process.argv[1]); process.stdout.write(value.beta ?? "")' "$RUNNER_TEMP/npm-tags.json")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          node scripts/check-release-order.mjs "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$LATEST" "$BETA"

      - name: Run release CI gates
        run: scripts/ci-gates.sh

      - name: Build release package
        env:
          APPLEBOOKSCLI_TAG: ${{ github.ref_name }}
        run: scripts/build-release.sh

      - name: Attest release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/chiimagnus-applebookscli-${{ steps.metadata.outputs.version }}.tgz

      - name: Publish npm package
        run: npm publish "./dist/chiimagnus-applebookscli-$RELEASE_VERSION.tgz" --access public --tag "$NPM_DIST_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="dist/chiimagnus-applebookscli-$RELEASE_VERSION.tgz"
          if [ "$GITHUB_PRERELEASE" = true ]; then
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --latest
          fi
