name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build immutable release candidate
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Record toolchain
        run: |
          test "$(uname -m)" = "arm64"
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          brew --version
          gh --version

      - name: Verify tag matches built CLI version
        run: |
          swift build --disable-automatic-resolution --product applebookscli
          BIN_DIR=$(swift build --disable-automatic-resolution --show-bin-path)
          VERSION=$("$BIN_DIR/applebookscli" --version)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Run Swift tests and capability gates
        run: |
          swift test --disable-automatic-resolution
          swift test --disable-automatic-resolution --filter CapabilityParityTests
          swift test --disable-automatic-resolution --filter CLICapabilityReachabilityTests

      - name: Validate packaged Skill and public source history
        run: |
          Tests/PackagingTests/skill-smoke.sh Skill/applebookscli
          swift scripts/check-private-data.swift --self-test
          swift scripts/check-private-data.swift --static

      - name: Verify dependency provenance and licenses
        run: |
          test "$(git -C .build/checkouts/swift-argument-parser rev-parse HEAD)" = "6a52f3251125d74daf04fcbd5e6f08a75d074382"
          test "$(git -C .build/checkouts/SwiftSoup rev-parse HEAD)" = "18b80329749eca5ea29fc50211dca5c7eff5bfec"
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"
          cmp .build/checkouts/swift-argument-parser/LICENSE.txt ThirdPartyLicenses/swift-argument-parser-Apache-2.0.txt
          cmp .build/checkouts/SwiftSoup/LICENSE ThirdPartyLicenses/SwiftSoup-MIT.txt
          cmp .build/checkouts/ZIPFoundation/LICENSE ThirdPartyLicenses/ZIPFoundation-MIT.txt

      - name: Build and verify release assets
        run: |
          scripts/build-release.sh
          VERSION=$(dist/universal/applebookscli --version)
          ARCHIVE="dist/applebookscli-$VERSION-macos-universal.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          test -f "$ARCHIVE"
          test -f "$CHECKSUM"
          (cd dist && shasum -a 256 -c "$(basename "$CHECKSUM")")
          git diff --exit-code -- Package.resolved
          git diff --check

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(dist/universal/applebookscli --version)
          ARCHIVE="dist/applebookscli-$VERSION-macos-universal.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" \
            --verify-tag \
            --notes-from-tag \
            --title "$GITHUB_REF_NAME"
